# Cross-platform CI: the platform-neutral core (transliterator, key
# mapping, candidate engine, localization, dictionary, INI settings
# store) must build and pass its tests on all three target OSes — this is
# the feature-parity guard for the platform front-ends. Windows builds
# the full IME (TSF DLL, service, UI); macOS builds the InputMethodKit
# app; Ubuntu builds the IBus engine + GTK settings dialog.
name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The Linux front-end targets are auto-skipped when these dev
      # packages are absent, so this install step is what makes the IBus
      # engine + GTK dialog an actual compile gate on ubuntu-latest.
      - name: Install Linux IME dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libibus-1.0-dev libgtk-3-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --config Debug

      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
